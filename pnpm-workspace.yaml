packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 requires an explicit decision on every dependency with a build script,
# so a package cannot run arbitrary code at install time unnoticed.
allowBuilds:
  # Needed: native binaries the toolchain actually runs.
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  sharp: true

  # Not needed: optional peers of better-auth's Prisma adapter. Nexora uses
  # Drizzle on Postgres, so neither is ever loaded.
  "@prisma/client": false
  better-sqlite3: false

minimumReleaseAgeExclude:
  - lucide-react@1.40.0
